name:  TEST BUILD
env: 
  IMAGE_TAG: ${{ github.sha }}
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Runt tests [Embedded mongo]
        run: mvn clean verify -Dspring.profiles.active=dev

      - name: Run tests  [Testcontainers mode]
        run: mvn clean verify -Dspring.profiles.active=prod

  build_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with: 
          push: true
          tags: | 
            dkcodepro/libraryapp:${{ env.IMAGE_TAG }}
            dkcodepro/libraryapp:latest